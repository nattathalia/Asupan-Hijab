<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css"
    >

    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
</head>

<body>

<video
    id="my-video"
    controls
    playsinline
    style="width:100%; max-width:800px;"
>
</video>

<script>

fluidPlayer(
    "my-video",
    {
        layoutControls: {
            autoPlay: false,
            mute: true,
            playButtonShowing: true
        },

        vastOptions: {
            adList: [
                {
                    roll: "preRoll",

                    vastTag:
                        "https://s.magsrv.com/v1/vast.php?idzone=6003394"
                }
            ]
        }
    }
);

</script>

</body>
</html>
