/* =========================================================
   OVERLAY
========================================================= */

#overlay{

    inset:0;
    width:100%;
    height:100%;

    display:none;
    z-index:9998;
}

#overlay.active{

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:fixed;
    top:0;
    left:-290px;

    width:280px;
    height:100%;

    background:linear-gradient(
        180deg,
        #0d47a1,
        #1976d2

    z-index:9999;

    box-shadow:

.sidebar.active{

.category-3d-box{

/* =========================================================
   CATEGORY ICON
========================================================= */

.category-icon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #1976d2,
            #0d47a1

    font-size:23px;

    box-shadow:
        0 5px 0 #07346f,

    flex-shrink:0;
}


/* =========================================================
   CATEGORY TEXT
========================================================= */

.category-text{
    margin-left:14px;
}

.category-text h2{
    margin:0;

    font-size:21px;
    font-weight:700;

    color:#123c70;

    text-shadow:
        1px 1px 0 #fff,
        2px 3px 4px rgba(0,0,0,.2);
}

.category-text p{
    margin:2px 0 0;

    font-size:12px;
    font-weight:500;

    color:#555;

    letter-spacing:.5px;
}


/* =========================================================
   MENU LIST
========================================================= */

.menu-list{
    padding:18px;
}


/* =========================================================
   MENU ITEM
========================================================= */

.menu-item{
    position:relative;

    display:block;

    width:100%;
    height:105px;

    margin-bottom:15px;

    border-radius:18px;

    overflow:hidden;

    text-decoration:none;

    background:#222;

    box-shadow:
        0 6px 15px rgba(0,0,0,.25);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}


/* =========================================================
   MENU FOTO
========================================================= */

.menu-logo{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border:0;

    border-radius:0;

    transition:
        transform .4s ease;
}


/* =========================================================
   MENU OVERLAY
========================================================= */

.menu-item::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.10),
            rgba(0,0,0,.65)
        );

    z-index:1;
}


/* =========================================================
   MENU TEXT
========================================================= */

.menu-item span{
    position:absolute;

    left:18px;
    bottom:15px;

    z-index:2;

    color:#fff;

    font-size:18px;
    font-weight:700;

    text-shadow:
        0 2px 6px rgba(0,0,0,.8);
}


/* =========================================================
   MENU ARROW
========================================================= */

.menu-item .fa-chevron-right{
    position:absolute;

    right:18px;
    bottom:18px;

    z-index:2;

    color:#fff;

    font-size:16px;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8);
}


/* =========================================================
   MENU HOVER
========================================================= */

.menu-item:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 22px rgba(0,0,0,.35);
}

.menu-item:hover .menu-logo{
    transform:scale(1.08);
}


/* =========================================================
   SIDEBAR SCROLLBAR
========================================================= */

.sidebar::-webkit-scrollbar{
    width:8px;
}

.sidebar::-webkit-scrollbar-thumb{
    background:#ffffff66;
    border-radius:20px;
}


/* =========================================================
   HEADER
========================================================= */

header{

    top:0;
    left:0;

    width:100%;
    height:90px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#fff;

    box-shadow:
        0 2px 10px rgba(0,0,0,.08);

    z-index:900;
}


/* =========================================================
   MENU BUTTON
========================================================= */

#menuBtn{
    width:50px;
    height:50px;

    border:none;

    background:transparent;

    color:#111;

    font-size:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        transform .3s ease;
}

#menuBtn:hover{
    transform:rotate(90deg);
}


/* =========================================================
   LOGO HEADER
========================================================= */

.logo{
    flex:1;

    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{

    height:70px;

}


/* =========================================================
   HEADER RIGHT
========================================================= */

.blank{

}


/* =========================================================
   HERO
========================================================= */

.hero{

}

.hero h1{
    margin-bottom:12px;

    font-size:30px;

}

.hero p{

    font-size:15px;

    line-height:1.8;

    color:#666;
}


/* =========================================================
   SEARCH
========================================================= */

.search-area{
    max-width:700px;

    margin:0 auto 15px;

    padding:0 20px;
}

.search-box{
    display:flex;
    align-items:center;

    width:100%;

    background:#f4f4f4;

    border-radius:50px;

    padding:0 18px;

    box-shadow:

    transition:

}

.search-box:focus-within{

}

.search-box i{

    color:#777;
}

.search-box input{

    border:none;

    outline:none;

    background:transparent;

    padding:15px;

    font-size:15px;

    color:#111;
}


/* =========================================================
   MAIN
========================================================= */

main{
    width:100%;

    max-width:1280px;

    margin:auto;

    padding:
        0 15px 30px;
}


/* =========================================================
   VIDEO GRID
========================================================= */

.video-grid{
    width:100%;

    display:grid;

    grid-template-columns:1fr;

    gap:25px;

    max-width:850px;

    margin:20px auto 0;
}


/* =========================================================
   VIDEO CARD
========================================================= */

.video-card{
    background:transparent;

    border:none;

    box-shadow:none;

    border-radius:0;

    overflow:visible;

    text-align:center;

    transition:
        transform .3s ease;
}

.video-card:hover{
    transform:translateY(-3px);
}


/* =========================================================
   VIDEO TITLE
========================================================= */

.video-title{
    margin-bottom:10px;

    font-size:28px;

    font-weight:700;

    text-align:center;

    color:#111;
}


/* =========================================================
   VIDEO FRAME
========================================================= */

.video-frame{
    width:100%;

    border:4px solid #222;

    border-radius:3px;

    overflow:hidden;

    background:#fff;
}

.video-frame iframe{
    width:100%;

    aspect-ratio:16/9;

    display:block;

    border:0;
}


/* =========================================================
   VIDEO INFO
========================================================= */

.video-info{
    padding:15px;
}

.video-desc{
    font-size:14px;

    line-height:1.7;

    color:#666;
}


/* =========================================================
   PAGINATION
========================================================= */

.pagination{
    width:100%;

    max-width:1100px;

    margin:40px auto;

    padding:0 15px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:0;

    overflow:hidden;
}


/* =========================================================
   PAGINATION BUTTON UMUM
========================================================= */

.pagination button{
    height:52px;

    border:none;

    background:#1685d8;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    font-size:14px;

    font-weight:600;

    transition:
        background .25s ease,
        transform .25s ease;
}


/* =========================================================
   PREV / NEXT
========================================================= */

.pagination-main{
    min-width:130px;

    padding:0 15px;
}


/* =========================================================
   PREVIOUS BORDER
========================================================= */

#prevBtn{
    border-radius:
        12px 0 0 12px;
}


/* =========================================================
   NEXT BORDER
========================================================= */

#nextBtn{
    border-radius:
        0 12px 12px 0;
}


/* =========================================================
   PAGE NUMBERS
========================================================= */

#pageNumbers{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:0;

    flex-wrap:nowrap;

    overflow-x:auto;

    overflow-y:hidden;

    max-width:600px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;
}

#pageNumbers::-webkit-scrollbar{
    display:none;
}


/* =========================================================
   NOMOR HALAMAN
========================================================= */

.page-number{
    flex:0 0 auto;

    width:52px;
    height:52px;

    padding:0;

    border-radius:0 !important;

    background:#1685d8;

    color:#fff;

    font-size:15px;

    font-weight:600;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:
        background .25s ease,
        transform .25s ease;
}


/* =========================================================
   NOMOR AKTIF
========================================================= */

.page-number.active{
    background:#91c9ed;

    color:#fff;

    cursor:default;

    transform:none;
}


/* =========================================================
   HOVER NOMOR
========================================================= */

.page-number:not(.active):hover{
    background:#0875c9;

    transform:
        translateY(-2px);
}


/* =========================================================
   PAGINATION HOVER
========================================================= */

.pagination button:not(:disabled):hover{
    background:#0875c9;

    transform:
        translateY(-2px);
}


/* =========================================================
   PAGINATION DISABLED
========================================================= */

.pagination button:disabled{
    background:#91c9ed;

    color:#fff;

    opacity:1;

    cursor:not-allowed;

    transform:none;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    width:100%;

    margin-top:35px;

    padding:
        20px 15px 22px;

    text-align:center;

    background:#fafafa;

    border-top:
        1px solid #e5e5e5;

/* =========================================================

========================================================= */

.footer-logo{

    justify-content:center;

.footer-logo img{

/* =========================================================

========================================================= */

footer p{

    line-height:1.6;

    color:#666;
}


/* =========================================================
   WEBSITE SCROLLBAR
========================================================= */

::-webkit-scrollbar{

}

::-webkit-scrollbar-track{
    background:#f2f2f2;
}

::-webkit-scrollbar-thumb{

    border-radius:20px;

::-webkit-scrollbar-thumb:hover{

}

@media(max-width:768px){

    }

    .logo img{

    }

    .blank{
        width:45px;
        height:45px;
    }

    .hero{
        padding:25px 15px;
    }

    .hero h1{
        font-size:24px;
    }

    .hero p{
        font-size:14px;
    }

    .search-area{
        padding:
            0 15px 10px;
    }

    .exoclick-ad{
        margin:
            10px auto 20px;

        padding:
            0 10px;
    }

    .video-grid{
        gap:20px;
    }

    .video-title{
        font-size:20px;

        margin-bottom:8px;
    }

    .pagination{
        width:100%;

        margin:30px auto;

        padding:0 5px;

        justify-content:center;
    }

    .pagination-main{
        min-width:82px;

        height:44px;

        padding:0 7px;

        font-size:10px;

        gap:4px;
    }

    #pageNumbers{
        max-width:
            calc(100vw - 164px);

        flex:1 1 auto;

        justify-content:flex-start;

        overflow-x:auto;
    }

    .page-number{
        width:42px;
        min-width:42px;

        height:44px;

        font-size:13px;
    }

    footer{
        padding:
            18px 15px 20px;
    }

    .footer-logo img{
        height:42px;

        max-width:120px;
    }

    footer p{
        font-size:11px;
    }

}


/* =========================================================
   MOBILE KECIL <= 480PX
========================================================= */

@media(max-width:480px){

    header{
        height:75px;
    }

    .logo img{
        height:55px;

    }

    #menuBtn{
        width:42px;
        height:42px;

        font-size:25px;
    }

    .blank{
        width:42px;
        height:42px;
    }

    .pagination{
        padding:0 4px;
    }

    .pagination-main{
        min-width:72px;

        height:42px;

        font-size:9px;
    }

    #pageNumbers{
        max-width:
            calc(100vw - 144px);
    }

    .page-number{
        width:40px;
        min-width:40px;

        height:42px;

        font-size:12px;
    }

}


/* =========================================================
   TABLET
========================================================= */

@media(min-width:769px) and (max-width:999px){

    main{
        max-width:900px;
    }

    .video-grid{
        max-width:850px;
    }

    #pageNumbers{
        max-width:450px;
    }

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:1000px){

    main{
        max-width:1280px;
    }

    .video-grid{
        max-width:850px;

        gap:30px;
    }

    .hero h1{
        font-size:34px;
    }

    .hero p{
        font-size:16px;
    }

}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media(min-width:1400px){

    main{
        max-width:1400px;
    }

    .video-grid{
        max-width:850px;
    }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

    #sidebar,
    #menuBtn,
    #overlay,
    .search-area,
    .exoclick-ad,
    .pagination{
        display:none !important;
    }

    body{
        background:#fff;
    }

}


/* =========================================================
   END CSS
========================================================= */

</style>
