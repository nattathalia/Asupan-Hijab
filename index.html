.category-3d-box{

}

.category-3d-box::before{

}

}

================================= */

.menu-item{

    position:relative;

    display:block;

    height:105px;

    margin-bottom:15px;

    border-radius:18px;

    overflow:hidden;

    text-decoration:none;

    background:#222;

    box-shadow:
    0 6px 15px
    rgba(0,0,0,.25);

    transition:
    .3s ease;

}


/* =================================
   FOTO
================================= */

.menu-logo{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border:0;

    border-radius:0;

    transition:
    .4s ease;

}


/* =================================
   LAPISAN GELAP
================================= */

.menu-item::after{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        180deg,
        rgba(0,0,0,.10),
        rgba(0,0,0,.65)

}

================================= */

}
