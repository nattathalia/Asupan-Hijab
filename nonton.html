<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Video</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #fff;
            color: #111;
            overflow-x: hidden;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            position: sticky;

            top: 0;

            width: 100%;
            height: 75px;

            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 2px 10px rgba(0, 0, 0, .1);

            z-index: 1000;
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .logo img {
            height: 55px;

            width: auto;

            max-width: 150px;

            object-fit: contain;
        }


        /* =========================================================
           MENU BUTTON
        ========================================================= */

        #menuBtn {
            position: absolute;

            left: 15px;

            width: 45px;
            height: 45px;

            border: 0;

            background: transparent;

            font-size: 27px;

            cursor: pointer;
        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            position: fixed;

            top: 0;
            left: -280px;

            width: 270px;
            height: 100%;

            padding: 20px;

            background:
                linear-gradient(
                    180deg,
                    #0d47a1,
                    #1976d2
                );

            z-index: 2000;

            transition:
                left .3s ease;
        }


        .sidebar.active {
            left: 0;
        }


        .sidebar a {
            display: block;

            color: #fff;

            text-decoration: none;

            padding: 15px 10px;

            border-bottom:
                1px solid rgba(255, 255, 255, .2);

            font-weight: 600;
        }


        /* =========================================================
           OVERLAY
        ========================================================= */

        .overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .45);

            display: none;

            z-index: 1500;
        }


        .overlay.active {
            display: block;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            text-align: center;

            padding:
                28px 15px 20px;
        }


        .hero h1 {
            font-size: 27px;

            margin-bottom: 8px;
        }


        .hero p {
            font-size: 14px;

            color: #666;

            line-height: 1.7;
        }


        /* =========================================================
           CONTAINER
        ========================================================= */

        .container {
            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                0 15px 40px;
        }


        /* =========================================================
           VIDEO TITLE
        ========================================================= */

        .video-title {
            font-size: 23px;

            text-align: center;

            margin:
                10px 0 18px;
        }


        /* =========================================================
           VIDEO FRAME
        ========================================================= */

        .video-frame {
            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            overflow: hidden;

            border-radius: 5px;
        }


        .video-frame iframe {
            width: 100%;
            height: 100%;

            border: 0;

            display: block;
        }


        /* =========================================================
           MESSAGE
        ========================================================= */

        .message {
            text-align: center;

            color: #777;

            padding:
                40px 15px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .hero h1 {
                font-size: 22px;
            }


            .container {
                padding:
                    0 10px 30px;
            }


            .logo img {
                height: 50px;
            }


            .video-title {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         OVERLAY
    ========================================================= -->

    <div
        id="overlay"
        class="overlay">
    </div>


    <!-- =========================================================
         SIDEBAR
    ========================================================= -->

    <aside
        id="sidebar"
        class="sidebar">


        <a href="index.html">
            Home
        </a>


        <a href="kategori1.html">
            Kategori 1
        </a>


        <a href="kategori2.html">
            Kategori 2
        </a>


        <a href="kategori3.html">
            Kategori 3
        </a>


    </aside>


    <!-- =========================================================
         HEADER
    ========================================================= -->

    <header>


        <button
            id="menuBtn"
            type="button"
            aria-label="Buka menu">

            ☰

        </button>


        <a
            href="index.html"
            class="logo">

            <img
                src="https://asupanhijab.xyz/Asupan%20Hijab.png.jpg"
                alt="Logo">

        </a>


    </header>


    <!-- =========================================================
         HERO
    ========================================================= -->

    <section class="hero">


        <h1 id="heroTitle">
            Memuat video...
        </h1>


        <p id="heroDescription">
            Memuat deskripsi...
        </p>


    </section>


    <!-- =========================================================
         VIDEO
    ========================================================= -->

    <main class="container">


        <h2
            id="videoTitle"
            class="video-title">

            Memuat video...

        </h2>


        <div id="videoContainer"></div>


    </main>


    <!-- =========================================================
         DATA VIDEO
    ========================================================= -->

    <script src="js/data.js"></script>


    <!-- =========================================================
         SCRIPT UTAMA
    ========================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   MENU
                ================================================= */

                const menuBtn =
                    document.getElementById(
                        "menuBtn"
                    );


                const sidebar =
                    document.getElementById(
                        "sidebar"
                    );


                const overlay =
                    document.getElementById(
                        "overlay"
                    );


                menuBtn.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.toggle(
                            "active"
                        );

                        overlay.classList.toggle(
                            "active"
                        );

                    }
                );


                overlay.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.remove(
                            "active"
                        );

                        overlay.classList.remove(
                            "active"
                        );

                    }
                );


                /* =================================================
                   AMBIL ID DARI URL
                ================================================= */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const requestedId =
                    params.get("id");


                /* =================================================
                   ELEMENT
                ================================================= */

                const titleElement =
                    document.getElementById(
                        "videoTitle"
                    );


                const heroTitle =
                    document.getElementById(
                        "heroTitle"
                    );


                const descriptionElement =
                    document.getElementById(
                        "heroDescription"
                    );


                const container =
                    document.getElementById(
                        "videoContainer"
                    );


                /* =================================================
                   CEK ID DAN DATA
                ================================================= */

                if (
                    !requestedId ||
                    typeof videos === "undefined"
                ) {

                    titleElement.textContent =
                        "Video tidak ditemukan";


                    heroTitle.textContent =
                        "Video tidak ditemukan";


                    descriptionElement.textContent =
                        "Data video tidak tersedia.";

                    return;

                }


                /* =================================================
                   CARI VIDEO
                ================================================= */

                let foundVideo = null;


                for (
                    const category in videos
                ) {


                    if (
                        !Array.isArray(
                            videos[category]
                        )
                    ) {

                        continue;

                    }


                    const result =
                        videos[category].find(
                            function (video) {

                                return String(
                                    video.id ||
                                    video.title ||
                                    ""
                                ).toLowerCase() ===
                                String(
                                    requestedId
                                ).toLowerCase();

                            }
                        );


                    if (result) {

                        foundVideo =
                            result;

                        break;

                    }

                }


                /* =================================================
                   VIDEO TIDAK DITEMUKAN
                ================================================= */

                if (!foundVideo) {

                    titleElement.textContent =
                        "Video tidak ditemukan";


                    heroTitle.textContent =
                        "Video tidak ditemukan";


                    descriptionElement.textContent =
                        "Video tidak tersedia.";

                    return;

                }


                /* =================================================
                   DATA VIDEO
                ================================================= */

                const title =
                    String(
                        foundVideo.title ||
                        "Video"
                    );


                const embed =
                    String(
                        foundVideo.embed ||
                        foundVideo.url ||
                        ""
                    );


                const description =
                    String(
                        foundVideo.description ||
                        foundVideo.desc ||
                        "Video pilihan."
                    );


                /* =================================================
                   TAMPILKAN JUDUL & DESKRIPSI
                ================================================= */

                titleElement.textContent =
                    title;


                heroTitle.textContent =
                    title;


                descriptionElement.textContent =
                    description;


                /* =================================================
                   CEK EMBED
                ================================================= */

                if (!embed) {

                    container.innerHTML =
                        '<div class="message">' +
                        'Link video tidak tersedia.' +
                        '</div>';

                    return;

                }


                /* =================================================
                   BUAT VIDEO FRAME
                ================================================= */

                const frame =
                    document.createElement(
                        "div"
                    );


                frame.className =
                    "video-frame";


                /* =================================================
                   BUAT IFRAME
                ================================================= */

                const iframe =
                    document.createElement(
                        "iframe"
                    );


                iframe.src =
                    embed;


                iframe.title =
                    title;


                iframe.loading =
                    "lazy";


                iframe.allowFullscreen =
                    true;


                /* =================================================
                   MASUKKAN IFRAME
                ================================================= */

                frame.appendChild(
                    iframe
                );


                container.appendChild(
                    frame
                );


            }

        );

    </script>


</body>

</html>
