<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Video</title>

<!-- FONT -->
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

<!-- FONT AWESOME -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


html,
body{
    width:100%;
    min-height:100%;
}


body{
    background:#fff;
    color:#111;
    overflow-x:hidden;
}


/* =========================================================
   OVERLAY
========================================================= */

#overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.45);

    display:none;

    z-index:9998;
}


#overlay.active{
    display:block;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:fixed;

    top:0;
    left:-290px;

    width:280px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            #0d47a1,
            #1976d2
        );

    overflow-y:auto;

    transition:left .35s ease;

    z-index:9999;

    box-shadow:
        8px 0 25px rgba(0,0,0,.35);
}


.sidebar.active{
    left:0;
}


/* =========================================================
   SIDEBAR HEADER
========================================================= */

.sidebar-header{
    padding:22px 15px;

    border-bottom:
        1px solid rgba(255,255,255,.15);
}


/* =========================================================
   CATEGORY 3D BOX
========================================================= */

.category-3d-box{
    width:100%;
    min-height:78px;

    display:flex;
    align-items:center;

    padding:12px 16px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #e6e6e6
        );

    box-shadow:
        0 10px 0 #b8b8b8,
        0 15px 25px rgba(0,0,0,.35),
        inset 0 2px 3px rgba(255,255,255,.9);
}


.category-icon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #1976d2,
            #0d47a1
        );

    color:#fff;

    font-size:23px;

    box-shadow:
        0 5px 0 #07346f,
        0 8px 15px rgba(0,0,0,.3);

    flex-shrink:0;
}


.category-text{
    margin-left:14px;
}


.category-text h2{
    font-size:21px;
    font-weight:700;

    color:#123c70;
}


.category-text p{
    margin-top:2px;

    font-size:12px;

    color:#555;

    letter-spacing:.5px;
}


/* =========================================================
   MENU LIST
========================================================= */

.menu-list{
    padding:18px;
}


/* =========================================================
   MENU ITEM
========================================================= */

.menu-item{
    position:relative;

    display:block;

    width:100%;
    height:105px;

    margin-bottom:15px;

    border-radius:18px;

    overflow:hidden;

    text-decoration:none;

    background:#222;

    box-shadow:
        0 6px 15px rgba(0,0,0,.25);

    transition:.3s ease;
}


/* =========================================================
   MENU IMAGE
========================================================= */

.menu-logo{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transition:.4s ease;
}


/* =========================================================
   MENU OVERLAY
========================================================= */

.menu-item::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.10),
            rgba(0,0,0,.65)
        );
}


/* =========================================================
   MENU TEXT
========================================================= */

.menu-item span{
    position:absolute;

    left:18px;
    bottom:15px;

    z-index:2;

    color:#fff;

    font-size:18px;
    font-weight:700;

    text-shadow:
        0 2px 6px rgba(0,0,0,.8);
}


/* =========================================================
   MENU ARROW
========================================================= */

.menu-item .fa-chevron-right{
    position:absolute;

    right:18px;
    bottom:18px;

    z-index:2;

    color:#fff;
}


/* =========================================================
   MENU HOVER
========================================================= */

.menu-item:hover{
    transform:translateY(-3px);
}


.menu-item:hover .menu-logo{
    transform:scale(1.08);
}


/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;

    top:0;

    width:100%;
    height:90px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#fff;

    box-shadow:
        0 2px 10px rgba(0,0,0,.08);

    z-index:900;
}


/* =========================================================
   MENU BUTTON
========================================================= */

#menuBtn{
    width:50px;
    height:50px;

    border:none;

    background:transparent;

    color:#111;

    font-size:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        transform .3s ease;
}


#menuBtn:hover{
    transform:rotate(90deg);
}


/* =========================================================
   LOGO
========================================================= */

.logo{
    flex:1;

    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
}


.logo img{
    width:auto;

    height:70px;

    max-width:180px;

    object-fit:contain;
}


/* =========================================================
   HEADER BLANK
========================================================= */

.blank{
    width:50px;
    height:50px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    text-align:center;

    padding:
        28px 15px 20px;
}


.hero h1{
    font-size:27px;

    margin-bottom:8px;

    line-height:1.4;
}


.hero p{
    font-size:14px;

    color:#666;

    line-height:1.7;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:
        0 15px 40px;
}


/* =========================================================
   VIDEO TITLE
========================================================= */

.video-title{
    font-size:23px;

    text-align:center;

    margin:
        10px 0 18px;

    line-height:1.5;
}


/* =========================================================
   VIDEO FRAME
========================================================= */

.video-frame{
    width:100%;

    aspect-ratio:16 / 9;

    background:#000;

    overflow:hidden;

    border-radius:5px;
}


/* =========================================================
   IFRAME
========================================================= */

.video-frame iframe{
    width:100%;
    height:100%;

    border:0;

    display:block;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
    text-align:center;

    color:#777;

    padding:
        40px 15px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    .sidebar{
        width:260px;

        left:-270px;
    }


    header{
        height:80px;

        padding:0 15px;
    }


    #menuBtn{
        width:45px;
        height:45px;

        font-size:28px;
    }


    .logo img{
        height:60px;

        max-width:155px;
    }


    .blank{
        width:45px;
        height:45px;
    }


    .menu-item{
        height:95px;
    }


    .menu-item span{
        font-size:16px;
    }


    .category-3d-box{
        min-height:70px;
    }


    .category-icon{
        width:44px;
        height:44px;

        font-size:20px;
    }


    .category-text h2{
        font-size:19px;
    }


    .hero h1{
        font-size:22px;
    }


    .container{
        padding:
            0 10px 30px;
    }


    .video-title{
        font-size:20px;
    }

}


</style>

</head>


<body>

========================================================= -->

<aside

    <!-- SIDEBAR HEADER -->

            </div>

            </div>

        </div>

    </div>


    <!-- MENU LIST -->

    <div class="menu-list">

        <a

            <span>Home</span>

            <i class="fa-solid fa-chevron-right"></i>

        </a>


        <!-- SEKOLAH -->

        <a

                alt="Sekolah">

            <span>Sekolah</span>

            <i class="fa-solid fa-chevron-right"></i>

        </a>


        <!-- MUDA -->

        <a
            href="muda.html"
            class="menu-item">

            <img
                src="https://asupanhijab.xyz/muda.jpg"
                class="menu-logo"
                alt="Muda">

            <span>Muda</span>

            <i class="fa-solid fa-chevron-right"></i>

        </a>


        <!-- PUBLIK -->

        <a

        <!-- HIJAB -->

            <i class="fa-solid fa-chevron-right"></i>

        </a>


        <!-- MENU TAMBAHAN -->

        <a

            class="menu-item">

            <img

                alt="Kategori">

            <span>Kategori</span>

            <i class="fa-solid fa-chevron-right"></i>

        </a>


    </div>

</aside>


<!-- =========================================================
     HEADER
========================================================= -->

<header>


    <!-- MENU BUTTON -->

    <button
        id="menuBtn"
        type="button"
        aria-label="Buka menu"
        aria-controls="sidebar"
        aria-expanded="false">

        <i class="fa-solid fa-bars"></i>

    </button>


    <!-- LOGO -->

    <a
        href="index.html"
        class="logo">

        <img
            src="https://asupanhijab.xyz/Asupan%20Hijab.png.jpg"

    </a>


    <!-- BLANK -->

    <div class="blank"></div>


</header>


<!-- =========================================================
     HERO
========================================================= -->

<section class="hero">


    <h1 id="heroTitle">

    </h1>


    <p id="heroDescription">
        "Jika Vidio Terhalang Iklan Refres Untuk Bisa Mengklik Putar"
    </p>


</section>


<!-- =========================================================
     VIDEO
========================================================= -->

<main class="container">


    <div id="videoContainer"></div>


</main>


<!-- =========================================================
     DATA VIDEO
========================================================= -->

<script src="js/data.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /* =====================================================
           MENU
        ===================================================== */

        const menuBtn =
            document.getElementById(
                "menuBtn"
            );


        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const overlay =
            document.getElementById(
                "overlay"
            );


        function openMenu(){

            sidebar.classList.add(
                "active"
            );

            overlay.classList.add(
                "active"
            );

            menuBtn.setAttribute(
                "aria-expanded",
                "true"
            );

        }


        function closeMenu(){

            sidebar.classList.remove(
                "active"
            );

            overlay.classList.remove(
                "active"
            );

            menuBtn.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        menuBtn.addEventListener(
            "click",
            function(){

                if(
                    sidebar.classList.contains(
                        "active"
                    )
                ){

                    closeMenu();

                }else{

                    openMenu();

                }

            }
        );


        overlay.addEventListener(
            "click",
            closeMenu
        );


        document
            .querySelectorAll(
                ".menu-item"
            )
            .forEach(
                function(item){

                    item.addEventListener(
                        "click",
                        closeMenu
                    );

                }
            );


        /* =====================================================

           nonton.html?id=video01

        const params =
            new URLSearchParams(
                window.location.search
            );


        const requestedId =
            params.get("id");

    );

    );

        'Video tidak ditemukan.' +
        '</div>';

    return;

        }


        /* =====================================================

        let foundVideo = null;


        for(

            if(

            ){

                continue;

            }


            const result =
                videos[category].find(
                    function(video){

                        const videoId =
                            String(
                                video.id ||

                                ""
                            )
                            .trim()
                            .toLowerCase();


                        const searchId =
                            String(
                                requestedId
                            )
                            .trim()
                            .toLowerCase();


                        return videoId ===
                            searchId;

                    }
                );


            if(result){

                foundVideo =
                    result;

                break;

            }

        }


        /* =====================================================

        if(!foundVideo){

    descriptionElement.textContent =
        "Video tidak tersedia.";

    container.innerHTML =
        '<div class="message">' +
        'Video tidak ditemukan.' +
        '</div>';

    return;

}


        /* =====================================================
           DATA VIDEO
        ===================================================== */

        const title =
            String(
                foundVideo.title ||
                "Video"
            );


        const embed =
            String(
                foundVideo.embed ||
                foundVideo.url ||
                ""
            );


        const description =
            String(
                foundVideo.description ||
                foundVideo.desc ||
                "Video pilihan."
            );

/* =====================================================
   TAMPILKAN KETERANGAN
===================================================== */

        if(!embed){

            container.innerHTML =

                'Link video tidak tersedia.' +

            return;

        }

        const frame =
            document.createElement(

            );

        '</div>';

    return;

}

   DATA VIDEO

const title =
    String(
        foundVideo.title ||
        "Video"
    );

const embed =
    String(
        foundVideo.embed ||
        foundVideo.url ||
        ""
    );

const description =
    String(
        foundVideo.description ||
        foundVideo.desc ||
        "Video pilihan."
    );


/* =====================================================
   TAMPILKAN KETERANGAN
===================================================== */

heroTitle.textContent =
    title;

descriptionElement.textContent =
    description;


/* =====================================================
   CEK EMBED
===================================================== */

if(!embed){

    container.innerHTML =
        '<div class="message">' +
        'Link video tidak tersedia.' +
        '</div>';

    return;

}


/* =====================================================
   BUAT VIDEO FRAME
===================================================== */

const frame =
    document.createElement(
        "div"
    );

frame.className =
    "video-frame";


/* =====================================================
   BUAT IFRAME
===================================================== */

const iframe =
    document.createElement(
        "iframe"
    );

iframe.src =
    embed;

iframe.title =
    title;

iframe.loading =
    "lazy";

iframe.setAttribute(
    "allowfullscreen",
    ""
);

iframe.setAttribute(
    "allow",
    "autoplay; fullscreen; picture-in-picture"
);


/* =====================================================

    iframe
);

);
