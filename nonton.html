<script>
document.addEventListener("DOMContentLoaded",function(){

    const menuBtn=document.getElementById("menuBtn");
    const sidebar=document.getElementById("sidebar");
    const overlay=document.getElementById("overlay");

    function openMenu(){
        sidebar.classList.add("active");
        overlay.classList.add("active");
        menuBtn.setAttribute("aria-expanded","true");
    }

    function closeMenu(){
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
        menuBtn.setAttribute("aria-expanded","false");
    }

    menuBtn.addEventListener("click",function(){

        if(sidebar.classList.contains("active")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    overlay.addEventListener("click",closeMenu);

    document.querySelectorAll(".menu-item").forEach(function(item){

        item.addEventListener("click",closeMenu);

    });

});

    ========================================================= -->

            id="videoTitle"
            class="video-title">

            Memuat video...

        </h2>


        <div id="videoContainer"></div>


    </main>


    <!-- =========================================================
         DATA VIDEO
    ========================================================= -->

    <script src="js/data.js"></script>


    <!-- =========================================================
         SCRIPT UTAMA
    ========================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   MENU
                ================================================= */

                const menuBtn =
                    document.getElementById(
                        "menuBtn"
                    );


                const sidebar =
                    document.getElementById(
                        "sidebar"
                    );


                const overlay =
                    document.getElementById(
                        "overlay"
                    );


                menuBtn.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.toggle(
                            "active"
                        );

                        overlay.classList.toggle(
                            "active"
                        );

                    }
                );


                overlay.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.remove(
                            "active"
                        );

                        overlay.classList.remove(
                            "active"
                        );

                    }
                );


                /* =================================================
                   AMBIL ID DARI URL
                ================================================= */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const requestedId =
                    params.get("id");


                /* =================================================
                   ELEMENT
                ================================================= */

                const titleElement =
                    document.getElementById(
                        "videoTitle"
                    );


                const heroTitle =
                    document.getElementById(
                        "heroTitle"
                    );


                const descriptionElement =
                    document.getElementById(
                        "heroDescription"
                    );


                const container =
                    document.getElementById(
                        "videoContainer"
                    );


                /* =================================================
                   CEK ID DAN DATA
                ================================================= */

                if (
                    !requestedId ||
                    typeof videos === "undefined"
                ) {

                    titleElement.textContent =
                        "Video tidak ditemukan";


                    heroTitle.textContent =
                        "Video tidak ditemukan";


                    descriptionElement.textContent =
                        "Data video tidak tersedia.";

                    return;

                }


                /* =================================================
                   CARI VIDEO
                ================================================= */

                let foundVideo = null;


                for (
                    const category in videos
                ) {


                    if (
                        !Array.isArray(
                            videos[category]
                        )
                    ) {

                        continue;

                    }


                    const result =
                        videos[category].find(
                            function (video) {

                                return String(
                                    video.id ||
                                    video.title ||
                                    ""
                                ).toLowerCase() ===
                                String(
                                    requestedId
                                ).toLowerCase();

                            }
                        );


                    if (result) {

                        foundVideo =
                            result;

                        break;

                    }

                }


                /* =================================================
                   VIDEO TIDAK DITEMUKAN
                ================================================= */

                if (!foundVideo) {

                    titleElement.textContent =
                        "Video tidak ditemukan";


                    heroTitle.textContent =
                        "Video tidak ditemukan";


                    descriptionElement.textContent =
                        "Video tidak tersedia.";

                    return;

                }


                /* =================================================
                   DATA VIDEO
                ================================================= */

                const title =
                    String(
                        foundVideo.title ||
                        "Video"
                    );


                const embed =
                    String(
                        foundVideo.embed ||
                        foundVideo.url ||
                        ""
                    );


                const description =
                    String(
                        foundVideo.description ||
                        foundVideo.desc ||
                        "Video pilihan."
                    );


                /* =================================================
                   TAMPILKAN JUDUL & DESKRIPSI
                ================================================= */

                titleElement.textContent =
                    title;


                heroTitle.textContent =
                    title;


                descriptionElement.textContent =
                    description;


                /* =================================================
                   CEK EMBED
                ================================================= */

                if (!embed) {

                    container.innerHTML =
                        '<div class="message">' +
                        'Link video tidak tersedia.' +
                        '</div>';

                    return;

                }


                /* =================================================
                   BUAT VIDEO FRAME
                ================================================= */

                const frame =
                    document.createElement(
                        "div"
                    );


                frame.className =
                    "video-frame";


                /* =================================================
                   BUAT IFRAME
                ================================================= */

                const iframe =
                    document.createElement(
                        "iframe"
                    );


                iframe.src =
                    embed;


                iframe.title =
                    title;


                iframe.loading =
                    "lazy";


                iframe.allowFullscreen =
                    true;


                /* =================================================
                   MASUKKAN IFRAME
                ================================================= */

                frame.appendChild(
                    iframe
                );


                container.appendChild(
                    frame
                );


            }

        );

    </script>
